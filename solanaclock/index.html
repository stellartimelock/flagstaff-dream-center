<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>SolanaClock.com — Live SOL price</title>
<meta name="description" content="Live Solana (SOL) price from Binance, Coinbase and Kraken.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><div class="aurora"></div><div class="stars"></div><div class="stars s2"></div><div class="grid"></div></div>
<main class="screen">
  <header class="top">
    <h1><span class="brand-dot" aria-hidden="true"></span>Solana<span class="grad">Clock</span><span class="tld">.com</span></h1>
    <nav class="tabs" role="tablist"><span class="tab-pill" aria-hidden="true"></span>
      <button role="tab" data-view="clock" aria-selected="true">Clock</button>
      <button role="tab" data-view="orbit" aria-selected="false">Orbit</button>
      <button role="tab" data-view="table" aria-selected="false">Markets</button>
    </nav>
  </header>

  <!-- View 2: big price + epoch clock -->
  <section id="view-clock" class="view active" role="tabpanel">
    <div class="hero">
      <div class="card price-card">
        <div class="sol-logo" aria-hidden="true"><svg viewBox="0 0 100 100"><use href="#sol-mark"/></svg></div>
        <div class="big-price"><span id="clock-price">—</span><sup>USD</sup></div>
        <div id="clock-change" class="change">—</div>
        <svg id="spark" class="spark" viewBox="0 0 300 40" preserveAspectRatio="none" aria-label="SOL 24h price sparkline"></svg>
        <div id="spark-note" class="note"></div>
      </div>

      <div id="net" class="card epoch-card" title="Solana mainnet epoch clock">
        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="ringg" x1="1" y1=".5" x2="0" y2=".5"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#c84bff"/><stop offset="1" stop-color="#8ff3ff"/></linearGradient>
              <filter id="ringglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <circle class="ring-ticks" cx="100" cy="100" r="92"/>
            <circle class="ring-track" cx="100" cy="100" r="80"/>
            <circle id="ring-arc" class="ring-arc" cx="100" cy="100" r="80" pathLength="100" filter="url(#ringglow)"/>
            <circle id="ring-dot" class="ring-dot" cx="180" cy="100" r="5"/>
          </svg>
          <div class="ring-center">
            <div class="ep-label">Epoch</div>
            <div class="ep-num" id="net-epoch">—</div>
            <div class="ep-pct" id="net-pct">—</div>
          </div>
        </div>
        <div class="ep-stats">
          <div><span>Time left <em>(est.)</em></span><b id="net-eta">—</b></div>
          <div><span>Slots left</span><b id="net-left">—</b></div>
          <div><span>Next epoch <em>(est.)</em></span><b id="net-at">—</b></div>
          <div><span>Slot</span><b id="net-slot">—</b></div>
        </div>
        <div class="note ep-note"><span id="net-st">—</span> s/slot measured · estimate based on recent slot time</div>
        <div class="net-off">Solana network · Unavailable</div>
      </div>
    </div>
  </section>

  <!-- View 3: orbit -->
  <section id="view-orbit" class="view" role="tabpanel">
    <div class="orbit-wrap">
      <svg class="orbit-lines" id="orbit-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="orbit-ring" id="orbit-ring"></div>
      <div class="sol-bubble">
        <div class="sb-sym">SOL</div>
        <div class="sb-price"><span id="orbit-price">—</span><sup>USD</sup></div>
        <div id="orbit-change" class="change">—</div>
      </div>
    </div>
  </section>

  <!-- View 1: table -->
  <section id="view-table" class="view" role="tabpanel">
    <div class="table-scroll">
      <table class="mkt">
        <thead><tr><th>Asset</th><th class="num">Price</th><th class="num">24h % Change</th><th class="num hide-xs">Volume</th><th>Exchange</th></tr></thead>
        <tbody id="mkt-body"></tbody>
      </table>
    </div>
  </section>

  <footer class="foot">
    <div id="sources"><span class="live stale" id="live" aria-hidden="true"></span>Data from <span data-src="binance">Binance</span> · <span data-src="coinbase">Coinbase</span> · <span data-src="kraken">Kraken</span></div>
    <div id="updated" class="note"></div>
  </footer>
</main>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="sparkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c84bff" stop-opacity=".7"/><stop offset="1" stop-color="#8ff3ff"/></linearGradient>
    <linearGradient id="sparka" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8ff3ff" stop-opacity=".18"/><stop offset="1" stop-color="#8ff3ff" stop-opacity="0"/></linearGradient>
    <linearGradient id="solg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#9945FF"/><stop offset="1" stop-color="#14F195"/></linearGradient>
    <symbol id="sol-mark" viewBox="0 0 100 100">
      <path fill="#fff" d="M28 64h48l-10 10H18zM28 26h48L66 36H18zM18 45h48l10 10H28z"/>
    </symbol>
  </defs>
</svg>
<script src="js/app.js"></script>
</body>
</html>
